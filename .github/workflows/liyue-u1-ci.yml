name: Liyue Web U1

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/liyue-kitchen/**'
      - '.github/workflows/liyue-u1-ci.yml'
      - 'pnpm-lock.yaml'

permissions:
  contents: write

jobs:
  u1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Resolve dependencies for new workspace
        run: pnpm install --no-frozen-lockfile
      - name: Bootstrap lockfile once on this same-repository implementation branch
        if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/liyue-web-u1-pixijs'
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pnpm-lock.yaml
            git commit -m 'chore(liyue): generate frozen workspace lockfile'
            git push origin HEAD:feat/liyue-web-u1-pixijs
          fi
      - run: pnpm --filter @idea-slime-bar/liyue-kitchen typecheck
      - run: pnpm --filter @idea-slime-bar/liyue-kitchen test:domain
      - run: pnpm --filter @idea-slime-bar/liyue-kitchen build
      - run: pnpm --filter @idea-slime-bar/liyue-kitchen exec playwright install --with-deps chromium
      - run: pnpm --filter @idea-slime-bar/liyue-kitchen test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liyue-u1-playwright
          path: packages/liyue-kitchen/test-results/
          if-no-files-found: ignore
