name: Liyue domain validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/liyue-kitchen/**'
      - '.github/workflows/liyue-u1-ci.yml'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

# Keep the existing "u1" check identity for branch protection; visual and
# interaction verification now runs against the exact Vercel deployment.
jobs:
  u1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @idea-slime-bar/liyue-kitchen typecheck
      - run: pnpm --filter @idea-slime-bar/liyue-kitchen test:domain
      - run: pnpm --filter @idea-slime-bar/liyue-kitchen simulate:balance
      - run: pnpm --filter @idea-slime-bar/liyue-kitchen build
