name: Liyue Web U1

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/liyue-kitchen/**'
      - '.github/workflows/liyue-u1-ci.yml'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  u1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @idea-slime-bar/liyue-kitchen typecheck
      - run: pnpm --filter @idea-slime-bar/liyue-kitchen test:domain
      - run: pnpm --filter @idea-slime-bar/liyue-kitchen build
      - run: pnpm --filter @idea-slime-bar/liyue-kitchen exec playwright install --with-deps chromium
      - run: pnpm --filter @idea-slime-bar/liyue-kitchen test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liyue-u1-playwright
          path: packages/liyue-kitchen/test-results/
          if-no-files-found: ignore
